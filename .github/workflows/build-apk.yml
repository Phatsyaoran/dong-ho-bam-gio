name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install librsvg2-bin and convert SVG assets to PNG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon-only.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 assets/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 assets/icon-background.svg -o assets/icon-background.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons and splash screens
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0e14' --iconBackgroundColorDark '#0b0e14' --splashBackgroundColor '#0b0e14' --splashBackgroundColorDark '#0b0e14'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Update Android versionCode and versionName
        run: |
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=*[[:space:]]*)[0-9]+/\1${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=*[[:space:]]*)\"[^\"]+\"/\1\"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up Release Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="dialBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#141e2e" />
      <stop offset="100%" stop-color="#090d14" />
    </radialGradient>
    <linearGradient id="bezelGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background; stopwatch fits inside 59.3% safe zone (208px+ margin on all 4 sides) -->
  <g transform="translate(512, 512) scale(1.04)">
    <!-- Top stem and crown -->
    <rect x="-22" y="-250" width="44" height="52" rx="8" fill="#1e3a5f" />
    <rect x="-14" y="-250" width="28" height="48" rx="6" fill="#38bdf8" opacity="0.65" />
    <rect x="-56" y="-292" width="112" height="42" rx="21" fill="url(#crownGrad)" />

    <!-- Secondary button at 2 o'clock (52 deg) -->
    <g transform="translate(0, 44) rotate(52)">
      <rect x="-13" y="-268" width="26" height="30" rx="5" fill="#1e3a5f" />
      <rect x="-32" y="-290" width="64" height="28" rx="14" fill="url(#crownGrad)" />
    </g>

    <!-- Watch body & dial -->
    <circle cx="0" cy="44" r="236" fill="url(#dialBg)" />

    <!-- Subtle inner track -->
    <circle cx="0" cy="44" r="186" fill="none" stroke="#1e293b" stroke-width="14" />

    <!-- Glowing progress arc (12 o'clock clockwise to 10 o'clock = 300 deg) -->
    <path
      d="M 0 -142 A 186 186 0 1 1 -161.08 -49"
      fill="none"
      stroke="#38bdf8"
      stroke-width="16"
      stroke-linecap="round"
      opacity="0.45"
      filter="url(#neonGlow)"
    />
    <path
      d="M 0 -142 A 186 186 0 1 1 -161.08 -49"
      fill="none"
      stroke="url(#arcGrad)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Dial tick marks -->
    <g transform="translate(0, 44)" stroke-linecap="round">
      <line x1="0" y1="-162" x2="0" y2="-138" stroke="#7dd3fc" stroke-width="8" />
      <line x1="162" y1="0" x2="140" y2="0" stroke="#64748b" stroke-width="7" />
      <line x1="0" y1="162" x2="0" y2="140" stroke="#64748b" stroke-width="7" />
      <line x1="-162" y1="0" x2="-140" y2="0" stroke="#64748b" stroke-width="7" />

      <g stroke="#334155" stroke-width="5">
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(30)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(60)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(120)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(150)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(210)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(240)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(300)" />
        <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(330)" />
      </g>
    </g>

    <!-- Outer bright bezel ring -->
    <circle
      cx="0"
      cy="44"
      r="236"
      fill="none"
      stroke="#38bdf8"
      stroke-width="24"
      opacity="0.22"
      filter="url(#softGlow)"
    />
    <circle
      cx="0"
      cy="44"
      r="236"
      fill="none"
      stroke="url(#bezelGrad)"
      stroke-width="22"
    />

    <!-- Sharp stopwatch hand pointing to 10 o'clock (-60 deg) -->
    <g transform="translate(0, 44) rotate(-60)">
      <polygon points="0,-148 9,0 5,36 -5,36 -9,0" fill="#eef2f8" />
      <polygon points="0,-148 5,-82 -5,-82" fill="#7dd3fc" />
    </g>

    <!-- Center pivot -->
    <circle cx="0" cy="44" r="22" fill="#38bdf8" />
    <circle cx="0" cy="44" r="10" fill="#0b0e14" />
  </g>
</svg>
